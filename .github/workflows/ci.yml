# Quality gates for every push/PR. Deploys stay manual (DEPLOY.md §2);
# this pipeline only guarantees that main always passed the checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Ruff — format + lint
        run: |
          uvx ruff format --check .
          uvx ruff check .

      - name: Tests
        run: uv run pytest tests/ -q

      - name: Bandit — SAST on own code (fail on HIGH)
        run: uvx bandit -r src -lll -q

      - name: pip-audit — known CVEs in locked dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip

      - name: Build package + import smoke test
        run: |
          uv build
          uv run --no-project --isolated \
            --with dist/*.whl \
            python -c "import shopping_agent.models, shopping_agent.ratelimit, shopping_agent.pending"

      - name: Build Docker image
        run: docker build -t shopping-agent:ci .

      - name: Trivy — scan image (fail on HIGH/CRITICAL, fixed only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shopping-agent:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
